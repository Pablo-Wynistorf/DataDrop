<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataDrop · Secure file sharing</title>
    <meta name="description" content="Securely share files with anyone, anywhere. Free, fast and simple." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Landing page: intentionally static. No React, no bundle, no API calls, so
      "/" renders as soon as the HTML and CSS arrive from CloudFront. The app
      itself lives at /app (see app.html).
    -->
    <link rel="stylesheet" href="/src/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <!-- Ambient gradient blobs (mirrors src/components/Background.jsx) -->
    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
      <div class="absolute -left-24 -top-32 h-96 w-96 rounded-full bg-violet-300/40 blur-3xl"></div>
      <div class="absolute -right-24 top-1/3 h-[28rem] w-[28rem] rounded-full bg-sky-300/40 blur-3xl"></div>
      <div class="absolute bottom-0 left-1/3 h-96 w-96 rounded-full bg-blue-200/50 blur-3xl"></div>
    </div>

    <div class="relative z-10 flex min-h-screen flex-col">
      <header class="mx-auto flex w-full max-w-6xl items-center justify-between px-6 py-6">
        <a href="/" class="flex items-center gap-3" aria-label="DataDrop home">
          <span
            class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 text-white shadow-[0_12px_30px_-10px_rgba(37,99,235,0.7)]"
          >
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
              />
            </svg>
          </span>
          <span class="text-xl font-extrabold tracking-tight text-slate-900">DataDrop</span>
        </a>
        <a
          href="/app"
          class="rounded-full bg-slate-900 px-5 py-2 text-sm font-semibold text-white transition hover:bg-slate-800"
        >
          Log in
        </a>
      </header>

      <main
        class="mx-auto flex w-full max-w-6xl flex-1 flex-col items-center gap-10 px-6 py-10 lg:flex-row lg:justify-between lg:py-20"
      >
        <div class="max-w-md">
          <h1 class="text-5xl font-extrabold leading-tight tracking-tight text-slate-900 sm:text-6xl">
            Welcome to DataDrop
          </h1>
          <p class="mt-6 text-lg text-slate-500">Securely share files with anyone, anywhere.</p>
        </div>

        <div class="card w-full max-w-md p-8">
          <div class="mb-6 flex justify-center">
            <span
              class="flex h-16 w-16 items-center justify-center rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 text-white shadow-[0_12px_30px_-10px_rgba(37,99,235,0.7)]"
            >
              <svg class="h-8 w-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
                />
              </svg>
            </span>
          </div>
          <p class="text-center text-xl leading-relaxed text-slate-600">
            It's never been so easy and secure to share files — and completely
            <span class="font-bold text-slate-900">for free</span>!
          </p>
          <a href="/app" class="btn-primary mt-8 w-full py-4 text-lg">Sign in with OIDC</a>
        </div>
      </main>
    </div>
  </body>
</html>
